<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Da Nang Community Radio — Audiovisual Radio from Central Vietnam</title>
  <meta name="description" content="Da Nang Community Radio (DNCR) — Audiovisual radio platform from central Vietnam. Watch the latest broadcast, DNCR On The Air." />
  <style>
    :root {
      --bg: #0e0e0d;
      --surface: #161614;
      --surface-hover: #1e1e1b;
      --border: #2a2926;
      --text: #f3f0e8;
      --muted: #9c988e;
      --accent: #e04f33;
      --accent-soft: rgba(224, 79, 51, 0.14);
      --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: var(--sans);
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    /* Top Bar */
    .site-header {
      border-bottom: 1px solid var(--border);
      padding: 1rem 1.5rem;
    }

    .header-inner {
      max-width: 1120px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      flex-wrap: wrap;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }
